name: CI tests

on:
  pull_request:
  push:
    branches:
    - main
    - 'push-action/**'

permissions:
  contents: read

env:
  LINTING_PY_VERSION: "3.11"  # The version of Python to use for linting (typically the minimum supported)

# Cancel running workflows when additional changes are pushed
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-using-a-fallback-value
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python ${{ env.LINTING_PY_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.LINTING_PY_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true

    - name: Install latest compatible versions of immediate dependencies
      run: uv sync --all-extras --extra-index-url https://pip.ccdc.cam.ac.uk

    - name: Run pre-commit
      run: uv run pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )

  pytest:
    # Runs the test suite against a mocked CSD Python API: needs no CSD licence
    # or secrets, so this also runs for pull requests from forks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ env.LINTING_PY_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.LINTING_PY_VERSION }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Install locked dependencies
      run: uv sync --locked --all-extras --extra-index-url https://pip.ccdc.cam.ac.uk

    - name: Run pytest
      run: uv run pytest
